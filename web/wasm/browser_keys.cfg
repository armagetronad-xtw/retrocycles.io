# The browser client's key template, preloaded as /aa/etc/browser_keys.cfg and
# included by browser_user.cfg on the first run (in place of keys_cursor.cfg).
# Home row: d f turn left, j k turn right, a glance left, s glance right,
# ; glance back, space brake. The arrows stay as a second way to steer.
# p toggles fullscreen (the page's Fullscreen API, API.md event "fullscreen");
# it was default.cfg's pause key, a local-game-only action.
# Only player 1 exists in the browser. The page moves a browser still on the old
# keys_cursor.cfg defaults to this template once (web/page/src/keys.ts).
KEYBOARD	100	PLAYER_BIND	CYCLE_TURN_LEFT	1
KEYBOARD	102	PLAYER_BIND	CYCLE_TURN_LEFT	1
KEYBOARD	106	PLAYER_BIND	CYCLE_TURN_RIGHT	1
KEYBOARD	107	PLAYER_BIND	CYCLE_TURN_RIGHT	1
KEYBOARD	97	PLAYER_BIND	GLANCE_LEFT	1
KEYBOARD	115	PLAYER_BIND	GLANCE_RIGHT	1
KEYBOARD	59	PLAYER_BIND	GLANCE_BACK	1
KEYBOARD	32	PLAYER_BIND	CYCLE_BRAKE	1
KEYBOARD	276	PLAYER_BIND	CYCLE_TURN_LEFT	1
KEYBOARD	275	PLAYER_BIND	CYCLE_TURN_RIGHT	1
KEYBOARD	274	PLAYER_BIND	CYCLE_BRAKE	1
KEYBOARD	118	PLAYER_BIND	SWITCH_VIEW	1
KEYBOARD	112	PLAYER_BIND	TOGGLE_FULLSCREEN	0
