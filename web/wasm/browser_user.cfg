# First run defaults of the browser client, preloaded as
# /aa/etc/browser_user.cfg. gBrowserPersistRestore() copies it to
# /aa/user/var/user.cfg (the IDBFS mount, see aa_api.js) when that file does
# not exist yet; from then on user.cfg is what the client saves.
# The first-use menus are skipped in the browser: default.cfg (what the native
# client loads on its first run: Escape = INGAME_MENU, Enter = CHAT, backquote
# = CONSOLE_INPUT, Tab = SCORE, camera and instant chat keys, tooltips) and the
# browser's own key template (browser_keys.cfg; it takes f from the fullscreen
# key of default.cfg) are included here.
INCLUDE default.cfg
INCLUDE browser_keys.cfg
# default.cfg puts the camera on mouse motion too (324-327: SDLK_MOUSE_X_PLUS,
# X_MINUS, Y_PLUS, Y_MINUS); in the browser a mouse moved over the game swung the
# view. Unbound here (an unknown action clears a key); the page drops them from
# older saved maps once (web/page/src/keys.ts dropMouseCamera).
KEYBOARD	324	PLAYER_BIND	NONE	1
KEYBOARD	325	PLAYER_BIND	NONE	1
KEYBOARD	326	PLAYER_BIND	NONE	1
KEYBOARD	327	PLAYER_BIND	NONE	1
PLAYER_1 Browser
FIRST_USE 0
TEXT_OUT 1
# sound starts off: the home screen's replay crashed and exploded at a new
# player's first click. Settings, SOUND turns it on.
SOUND_QUALITY 0
