# Browser client settings, preloaded as /aa/etc/autoexec.cfg (see Makefile):
# what every run needs regardless of the persisted user.cfg. The player facing
# defaults (name, key template) are in browser_user.cfg, the seed of user.cfg.
# no screenshots, no fullscreen switching, keep the window the canvas size
FULLSCREEN 0
ARMAGETRON_WINDOWSIZE 6
ARMAGETRON_WINDOWSIZE_W 800
ARMAGETRON_WINDOWSIZE_H 600
# the page cannot download maps and no first run logic runs: pretend we are set up
FIRST_USE 0
# no frame rate counter; the play page sets SHOW_FPS from its own setting
SHOW_FPS 0
# no control tooltips: the page shows the keys itself (web/page/src/components/KeysLine.tsx).
# Set here rather than in browser_user.cfg so it also overrides a saved user.cfg.
CHAT_TOOLTIP 0 0 0 0 0
CYCLE_BRAKE_TOOLTIP 0 0 0 0 0
CYCLE_TURN_LEFT_TOOLTIP 0 0 0 0 0
CYCLE_TURN_RIGHT_TOOLTIP 0 0 0 0 0
GLANCE_BACK_TOOLTIP 0 0 0 0 0
GLANCE_LEFT_TOOLTIP 0 0 0 0 0
GLANCE_RIGHT_TOOLTIP 0 0 0 0 0
SWITCH_VIEW_TOOLTIP 0 0 0 0 0
TOGGLE_SPECTATOR_TOOLTIP 0 0 0 0 0
INGAME_MENU_TOOLTIP 0 0 0 0 0
